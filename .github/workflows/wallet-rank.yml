# One-shot 30-day copy ranking. Uses the repo secret HELIUS_KEY.
# Does not change the wallets the live desk follows.

name: Wallet rank

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/wallet-rank.yml
      - wallet_rank.py

concurrency:
  group: wallet-rank
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Rebuild the 30-day ranking
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_KEY }}
        run: |
          if [ -z "$HELIUS_API_KEY" ]; then
            echo "HELIUS_API_KEY is not set."
            exit 0
          fi
          echo "HELIUS_API_KEY is set. Building the 30-day ranking."
          python wallet_rank.py

      - name: Commit the replay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- web/wallets/replay.json
          if git diff --cached --quiet; then
            echo "No replay change."
          else
            git commit -m "wallets: 30-day copy ranking [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
