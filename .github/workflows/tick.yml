# Paper desks, then the static dashboard.
# Pages is deployed from this workflow (upload-pages-artifact + deploy-pages),
# not from a docs/ branch. The site root is the web/ directory.
#
# GitHub's scheduler has not delivered a single schedule event for this repo.
# The cron below stays as a backup. The chain job re-dispatches this workflow
# with GITHUB_TOKEN so the bots keep running when cron does not.

name: Paper tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: halal-paper-tick
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh the wallet replay when it is older than a day
        run: |
          python wallet_replay.py --max-age-hours 20 --max-seconds 420 || echo "replay refresh failed; the previous file stays"

      - name: Run the four paper desks
        env:
          SIGNAL_WEBHOOK_URL: ${{ secrets.SIGNAL_WEBHOOK_URL }}
          SIGNAL_WEBHOOK_KEY: ${{ secrets.SIGNAL_WEBHOOK_KEY }}
        run: |
          # BTC evaluates every 60s for about 4 minutes while the other desks tick,
          # so this job stays near the 5-minute cron instead of stacking another run.
          python btc_tick.py --loop-seconds 250 &
          btc_pid=$!
          # Wallet copy is owned by copy-live.yml so this job does not poll those wallets.
          # Axiom scalper polls about every 8s and checkpoints about every 35s.
          python scalp_tick.py --loop-seconds 230 --interval 8 --commit &
          scalp_pid=$!
          set +e
          python tick.py
          s1=$?
          python copy_tick.py
          s2=$?
          python meme_tick.py
          s3=$?
          wait "$btc_pid"
          s4=$?
          wait "$scalp_pid"
          s5=$?
          set -e
          if [ "$s1" -ne 0 ] || [ "$s2" -ne 0 ] || [ "$s3" -ne 0 ] || [ "$s4" -ne 0 ] || [ "$s5" -ne 0 ]; then
            echo "desk failed main=$s1 copy=$s2 meme=$s3 btc=$s4 scalp=$s5"
            exit 1
          fi

      - name: Regenerate static dashboards
        run: |
          mkdir -p web/copy web/meme web/btc web/wallets web/scalp web/stocks
          cp web/index.html web/copy/index.html
          cp web/index.html web/meme/index.html
          cp web/index.html web/btc/index.html
          cp web/index.html web/wallets/index.html
          cp web/index.html web/scalp/index.html
          cp web/index.html web/stocks/index.html
          python export_page.py --desk main
          python export_page.py --state copy/state.json --out web/copy/data.json --desk copy
          python export_page.py --state meme/state.json --out web/meme/data.json --desk meme
          python export_page.py --state btc/state.json --out web/btc/data.json --desk btc
          # web/wallets/data.json is written by copy-live.yml. Regenerating it here
          # leaves an unstaged file that breaks the rebase below.
          python export_page.py --state scalp/state.json --out web/scalp/data.json --desk axiom

      - name: Commit state and dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # wallets/state.json and web/wallets/data.json belong to copy-live.yml.
          # Desk index copies are part of this commit so they are not left
          # unstaged. stocks/ and wallets/ belong to their own workflows.
          git add -- \
            state.json web/data.json \
            copy/state.json web/copy/data.json web/copy/index.html \
            meme/state.json web/meme/data.json web/meme/index.html \
            btc/state.json web/btc/data.json web/btc/index.html \
            web/wallets/replay.json web/wallets/index.html \
            scalp/state.json web/scalp/data.json web/scalp/index.html \
            web/stocks/index.html
          if git diff --cached --quiet; then
            echo "No changes in state.json or web/data.json."
          else
            git commit -m "tick: update paper book [skip ci]"
          fi
          # Drop unstaged edits (a wallet or stock file this job does not own)
          # before rebase. Commit already happened, so this does not undo it.
          git checkout -- . || true
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "tick push ok"
              exit 0
            fi
            echo "tick push rejected, rebase attempt ${attempt}"
            git checkout -- wallets/state.json web/wallets/data.json stocks/state.json web/stocks/data.json || true
            git checkout -- . || true
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "tick rebase failed"
              exit 1
            fi
            sleep $((attempt * 2))
          done
          echo "tick push failed after retries"
          exit 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: tick
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Always run, including when tick or deploy fails or is skipped.
  # On 12 Nov 2026 the chain died twice (08:59 and 11:20 UTC) because
  # `gh run list --status queued` counted 1 and this job refused to dispatch.
  # That queued run never started. A pending schedule is not a substitute.
  chain:
    needs: [tick, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Queue the next tick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "tick=${{ needs.tick.result }} deploy=${{ needs.deploy.result }}"
          live=$(gh run list --workflow tick.yml --limit 30 --json databaseId,status,event \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }} and .event == \"workflow_dispatch\" and (.status == \"queued\" or .status == \"in_progress\" or .status == \"waiting\" or .status == \"pending\" or .status == \"requested\"))] | length")
          echo "other live workflow_dispatch runs: ${live}"
          if [ "${live}" != "0" ]; then
            echo "A workflow_dispatch tick is already queued or running. Not adding another."
            exit 0
          fi
          gh workflow run tick.yml --ref main
